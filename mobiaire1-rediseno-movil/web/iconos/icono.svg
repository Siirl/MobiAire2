<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MobiAire Materno">
  <!-- Icono maskable: el fondo cubre todo el lienzo (zona segura ~80% central). -->
  <rect width="512" height="512" fill="#2f6b4f"/>
  <circle cx="256" cy="256" r="196" fill="#e7f1ea"/>
  <clipPath id="c"><circle cx="256" cy="256" r="196"/></clipPath>
  <g clip-path="url(#c)">
    <!-- hoja (aire limpio) -->
    <ellipse cx="166" cy="150" rx="60" ry="26" fill="#a8d0b7" transform="rotate(-42 166 150)"/>
    <!-- torso de la gestante -->
    <ellipse cx="278" cy="300" rx="96" ry="142" fill="#3d8362"/>
    <!-- vientre -->
    <circle cx="206" cy="322" r="60" fill="#e8927c"/>
    <!-- cabeza -->
    <circle cx="300" cy="168" r="40" fill="#1f4733"/>
  </g>
</svg>
